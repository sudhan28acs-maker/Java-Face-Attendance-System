# Server Port
server.port=8080

# Spring datasource configuration (Defaults to MySQL, auto creates database tables)
# Uncomment or adjust credentials matching your local MySQL / XAMPP setup:
# spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fallback resilient H2 in-memory DB profile (if MySQL service is not yet started, or run with --spring.profiles.active=mysql)
spring.datasource.url=jdbc:h2:mem:attendancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Max file upload size if sending photo samples
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
