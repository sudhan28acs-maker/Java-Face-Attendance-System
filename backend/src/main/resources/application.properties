# ================================================================
# Spring Boot Configuration for XAMPP MySQL / phpMyAdmin
# ================================================================
server.port=8080

# Connect directly to your XAMPP MySQL database 'attendance_db'
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Allow large biometric embeddings and base64 preview transfers
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
