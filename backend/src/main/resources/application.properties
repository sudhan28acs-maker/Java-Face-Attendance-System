# ================================================================
# Spring Boot Configuration for XAMPP MySQL with H2 Fallback
# ================================================================
server.port=8080

# Connect to XAMPP MySQL database 'attendance_db' (with auto fallback to H2 in memory)
# spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
# spring.datasource.username=root
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 In-Memory (Allows system to work seamlessly even if MySQL service isn't started)
# If MySQL is running, you can activate the mysql profile or uncomment the mysql properties
spring.datasource.url=jdbc:h2:mem:attendancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Allow large biometric embeddings and base64 preview transfers
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
